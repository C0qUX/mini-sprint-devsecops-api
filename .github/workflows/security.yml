name: Security Build Breaker

on:
  push:
    branches: [main, mini-sprint]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: SAST con Bandit
        run: bandit -r app.py -ll

      - name: SCA con pip-audit
        run: pip-audit -r requirements.txt

      - name: Comprobar secretos
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
