name: Security Build Breaker

on:
  push:
    branches: [main, mini-sprint, evidencia-build-breaker]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas de seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar API y pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.0.1
      - name: Ejecutar pruebas
        run: python -m pytest -q

  sast:
    name: SAST con Bandit
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Bandit
        run: python -m pip install bandit==1.9.4
      - name: Analizar codigo
        run: bandit -r app.py -ll

  sca:
    name: SCA con pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pip-audit
        run: python -m pip install pip-audit==2.10.0
      - name: Auditar dependencias declaradas
        run: pip-audit -r requirements.txt

  secrets:
    name: Deteccion de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar detect-secrets
        run: python -m pip install detect-secrets==1.5.0
      - name: Comprobar secretos
        shell: bash
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
